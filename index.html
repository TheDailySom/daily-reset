<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Reset</title>
<meta name="description" content="Morning, evening and ball plus band routines for neck, back, hips, legs and feet.">
<meta name="theme-color" content="#0c0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Reset">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,500..900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first vertical feed. One full-screen card per exercise, snap scrolling like reels, card tint = body area. */
:root{
  --bg:#0c0d16; --bg2:#161827; --fg:#f2f1f8; --muted:#a4a6bf; --line:#2a2d44; --chip:rgba(255,255,255,.08); --scrim:rgba(5,6,12,.62); --on-hue:#0c0d16; --bigop:.22;
  --neck:#a493ff; --upback:#5cb4ff; --lowback:#ff8466; --hips:#ff6bb0; --legs:#ffbb4d; --feet:#7ddc95;
  --f-display:"Anybody", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f3fa; --bg2:#ffffff; --fg:#17182b; --muted:#5e6079; --line:#d9d8e6; --chip:rgba(23,24,43,.06); --scrim:rgba(23,24,43,.35); --on-hue:#ffffff; --bigop:.12;
  --neck:#5a47d9; --upback:#1767c7; --lowback:#c9472a; --hips:#bc2d70; --legs:#a06300; --feet:#22804a; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f3fa; --bg2:#ffffff; --fg:#17182b; --muted:#5e6079; --line:#d9d8e6; --chip:rgba(23,24,43,.06); --scrim:rgba(23,24,43,.35); --on-hue:#ffffff; --bigop:.12;
  --neck:#5a47d9; --upback:#1767c7; --lowback:#c9472a; --hips:#bc2d70; --legs:#a06300; --feet:#22804a; color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
.app{-webkit-user-select:none;user-select:none}
.how,.cues,.lede,.tip{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}

/* top bar */
.top{position:absolute;inset:0 0 auto 0;z-index:20;padding:12px 16px 22px;background:linear-gradient(var(--bg) 58%,transparent);pointer-events:none}
.top > *{pointer-events:auto}
.row{display:flex;align-items:center;gap:8px}
.brand{font:800 15px/1 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.02em;text-transform:uppercase;margin-right:auto}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.seg{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:4px;margin-top:12px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg .ck{width:16px;height:16px;border-radius:50%;background:var(--feet);color:var(--on-hue);font-size:10px;display:inline-grid;place-items:center}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font:600 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neck),var(--upback),var(--lowback),var(--hips),var(--legs),var(--feet));transition:width .4s ease}

/* feed */
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;padding-top:152px;
  background:var(--bg);
  background:radial-gradient(110% 60% at 90% 8%,color-mix(in oklab,var(--h) 40%,transparent),transparent 62%),linear-gradient(180deg,color-mix(in oklab,var(--h) 14%,var(--bg)),var(--bg) 78%)}
.bigwrap{flex:1 1 0;min-height:0;position:relative;overflow:hidden;container-type:size;display:flex;align-items:flex-end;padding:0 34px 10px 16px;pointer-events:none}
.big{margin:0;font:900 clamp(40px,20vw,120px)/.86 var(--f-display);font-size:min(calc(96cqw / (var(--w) * .82)),calc(92cqh / (var(--n) * .9)),170px);font-variation-settings:"wdth" 150;letter-spacing:-.02em;white-space:pre-line;color:var(--h);opacity:var(--bigop);user-select:none;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
@container (max-height:46px){.big{display:none}}
.card.is-active .big{transform:translateY(-6px)}
.in{position:relative;z-index:1;padding:0 44px 22px 18px;display:flex;flex-direction:column;gap:14px}
.colA,.colB{display:flex;flex-direction:column;gap:14px;min-width:0}
.kick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--fg);display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--h)}
.chip.gear{background:transparent;border-style:dashed;color:var(--h)}
.tip{font-size:14px;color:var(--muted);margin:0;max-width:44ch}
.tip b{color:var(--fg)}
.chip.donechip{background:var(--h);color:var(--on-hue);border-color:transparent;display:none}
.card.is-done .chip.donechip{display:inline-flex}
.name{margin:0;font:800 clamp(30px,8.6vw,42px)/1.02 var(--f-display);font-variation-settings:"wdth" 108;text-wrap:balance;letter-spacing:-.005em}
.dose{align-self:flex-start;font:600 15px var(--f-mono);color:var(--h);background:var(--chip);border:1px solid var(--line);background:color-mix(in oklab,var(--h) 16%,transparent);border:1px solid color-mix(in oklab,var(--h) 40%,transparent);padding:6px 10px;border-radius:8px}
.how{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:s}
.how li{display:grid;grid-template-columns:24px 1fr;gap:10px;counter-increment:s;font-size:16px;line-height:1.4}
.how li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--h);color:var(--h);font:600 12px/21px var(--f-mono);text-align:center}
.cues{display:grid;gap:6px;margin:0;font-size:14px}
.cues div{display:grid;grid-template-columns:62px 1fr;gap:8px}
.cues dt{font:600 11px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cues dd{margin:0;color:var(--fg);opacity:.88}
.act{display:flex;gap:10px;align-items:center;margin-top:2px}
.done{flex:1;min-height:56px;border-radius:16px;border:1.5px solid var(--h);background:transparent;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,transform .12s}
.done:active{transform:scale(.97)}
.done svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none}
.card.is-done .done{background:var(--h);color:var(--on-hue)}
.timer{position:relative;width:64px;height:64px;flex:none;border:0;background:none;padding:0;border-radius:50%}
.timer svg{width:64px;height:64px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .trk{stroke:var(--line)}
.timer .arc{stroke:var(--h);stroke-linecap:round;stroke-dasharray:169.65;stroke-dashoffset:0;transition:stroke-dashoffset .95s linear}
.timer .tt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.timer b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.timer small{font:600 10px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card.ticking .timer{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.sets{display:flex;gap:6px}
.set{width:44px;height:56px;border-radius:12px;border:1.5px dashed var(--line);border:1.5px dashed color-mix(in oklab,var(--h) 60%,transparent);background:none;font:600 15px var(--f-mono);display:grid;place-items:center;transition:background .2s,color .2s,transform .12s}
.set small{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em}
.set.on{background:color-mix(in oklab,var(--h) 30%,transparent);border-style:solid}
.set:active{transform:scale(.94)}
.tstat{min-height:20px;font:600 13px var(--f-mono);color:var(--h)}
.src{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.reel{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;background:var(--chip);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600}
.reel svg{width:15px;height:15px;fill:currentColor}
.alt{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.noreel{color:var(--muted);font-size:13px}

/* double tap pop */
.pop{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none;opacity:0}
.pop svg{width:132px;height:132px}
.pop.go{animation:pop .8s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.12)}45%{transform:scale(.96)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}

/* intro + end */
.intro .in,.end .in{padding-bottom:34px}
.eyebrow{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.h1{margin:0;font:900 clamp(40px,12vw,60px)/.95 var(--f-display);font-variation-settings:"wdth" 120;text-wrap:balance}
.lede{margin:0;font-size:17px;max-width:40ch;opacity:.9}
.areas{display:flex;flex-wrap:wrap;gap:6px}
.cta{min-height:58px;border-radius:16px;border:0;background:var(--fg);color:var(--bg);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.ctas{display:grid;gap:10px}
.hint{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
.hint .k{display:none}
.hint svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.four{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:800 26px/1 var(--f-display);font-variation-settings:"wdth" 120;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--legs);padding:2px 0 2px 12px;margin:0}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--feet);display:grid;place-items:center}
.bigcheck svg{width:44px;height:44px;stroke:var(--on-hue);stroke-width:3.5;fill:none}

/* rail */
.rail{position:absolute;right:12px;top:50%;transform:translateY(-38%);z-index:15;display:flex;flex-direction:column;gap:7px}
.rail button{width:8px;height:8px;padding:0;border-radius:4px;border:0;background:var(--line);transition:height .25s,background .25s}
.rail button.done{background:color-mix(in oklab,var(--fg) 55%,transparent)}
.rail button.cur{height:24px;background:var(--fg)}

/* sheets */
.sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet.open{opacity:1}
.panel{background:var(--bg2);border-radius:22px 22px 0 0;max-height:88%;overflow:auto;padding:10px 18px 28px;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ph h2{margin:0;font:800 24px var(--f-display);font-variation-settings:"wdth" 115}
.x{border:1px solid var(--line);background:var(--chip);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1}
.panel p{color:var(--muted);font-size:14px;margin:6px 0 14px}
.grp{margin-top:18px}
.grp h3{margin:0 0 6px;font:700 15px var(--f-body);display:flex;align-items:center;gap:8px}
.grp h3 .d{width:10px;height:10px;border-radius:50%;background:var(--h)}
.grp h3 span{font:600 12px var(--f-mono);color:var(--muted)}
.lib{list-style:none;margin:0;padding:0}
.lib li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lib a{color:var(--fg);text-decoration:none;font-weight:600;font-size:15px}
.lib .by{font-size:12px;color:var(--muted)}
.use{font:600 10px var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--chip);border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;font:600 11px var(--f-mono);color:var(--muted)}
.day.today{border-color:var(--fg);color:var(--fg)}
.day i{display:block;height:5px;border-radius:3px;margin:5px 6px 0;background:var(--line)}
.day i.am.on{background:var(--legs)}
.day i.pm.on{background:var(--hips)}
.day i.gear.on{background:var(--neck)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
.small{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;margin-top:16px}

/* laptop and desktop: sidebar with the session list, wide two-column cards */
.list,.keys{display:none}
@media (min-width:1000px){
  .app{max-width:none;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:100%;border:0}
  .top{position:relative;inset:auto;grid-column:1;grid-row:1;height:100%;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:24px 20px 20px;display:flex;flex-direction:column;pointer-events:auto}
  .brand{font-size:15px;white-space:nowrap}
  .ibtn{padding:6px 10px;font-size:12px}
  .seg{grid-template-columns:1fr;margin-top:20px}
  .seg button{justify-content:flex-start;padding:9px 14px;font-size:15px}
  .prog{margin-top:16px}
  #feed{grid-column:2;grid-row:1}
  .rail{display:none}
  .list{display:flex;flex-direction:column;gap:2px;margin-top:14px}
  .list button{display:grid;grid-template-columns:24px minmax(0,1fr) 16px;gap:8px;align-items:center;text-align:left;border:0;background:none;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.3;color:var(--muted);transition:background .15s,color .15s}
  .list button:hover{background:var(--chip);color:var(--fg)}
  .list button.cur{background:var(--chip);color:var(--fg);box-shadow:inset 3px 0 0 var(--h)}
  .list .n{font:600 11px var(--f-mono);color:var(--h)}
  .list .ck2{color:var(--feet);font-size:13px;opacity:0}
  .list button.done .ck2{opacity:1}
  .list button.done .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
  .keys{display:block;margin:auto 0 0;padding-top:18px;font:500 12px/1.9 var(--f-mono);color:var(--muted)}
  .keys kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);margin-right:4px}
  .card{padding-top:36px}
  .bigwrap{padding:0 56px 14px}
  .big{font-size:min(calc(96cqw / (var(--w) * .82)),calc(92cqh / (var(--n) * .9)),128px)}
  .in{width:100%;max-width:1180px;margin:0 auto;padding:0 56px 44px}
  .ex .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);column-gap:48px;align-items:start}
  .ex .name{font-size:clamp(38px,4vw,60px)}
  .ex .how li{font-size:17px}
  .colB{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:22px}
  .intro .in > *,.end .in > *{max-width:720px}
  .ctas{display:flex;flex-wrap:wrap}
  .cta{padding:0 28px}
  .stats.four{grid-template-columns:repeat(4,1fr)}
  .hint{align-items:flex-start}
  .hint .k{display:inline}
  .hint .m,.hint svg{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .pop.go{opacity:1}
}
@media (max-height:700px){.in,.colA,.colB{gap:11px}.how li{font-size:15px}.cues{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <span class="brand">Daily Reset</span>
      <button class="ibtn" id="open-lib" aria-label="Open reel library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 9l5 3-5 3z"/></svg>Reels</button>
      <button class="ibtn" id="open-log" aria-label="Open log"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Log</button>
    </div>
    <div class="seg" id="seg">
      <button data-deck="am" aria-pressed="false">Morning</button>
      <button data-deck="pm" aria-pressed="false">Evening</button>
      <button data-deck="gear" aria-pressed="false">Ball + Band</button>
    </div>
    <div class="prog"><span id="pcount">0/0</span><span class="bar"><i id="pbar"></i></span><span id="pmins"></span></div>
    <nav class="list" id="list" aria-label="Moves in this session"></nav>
    <p class="keys"><kbd>↑</kbd><kbd>↓</kbd> previous or next move<br><kbd>D</kbd> mark done<br><kbd>T</kbd> start or pause timer</p>
  </div>
  <main id="feed" aria-live="off"></main>
  <nav class="rail" id="rail" aria-label="Exercises"></nav>

  <div class="sheet" id="sheet-lib" hidden><div class="panel" role="dialog" aria-label="Reel library"><div class="grab"></div><div id="lib-body"></div></div></div>
  <div class="sheet" id="sheet-log" hidden><div class="panel" role="dialog" aria-label="Log"><div class="grab"></div><div id="log-body"></div></div></div>
</div>

<script>
const IG = c => "https://www.instagram.com/p/" + c + "/";
const AREAS = {neck:"Neck", upback:"Upper back", lowback:"Lower back", hips:"Hips and glutes", legs:"Legs", feet:"Feet, heel, shin"};
const BIG = {neck:"NECK", upback:"UPPER\nBACK", lowback:"LOWER\nBACK", hips:"HIPS", legs:"LEGS", feet:"FEET"};
const TYPES = {mob:"Mobility", str:"Strength", st:"Stretch"};

const DECKS = {
  am: {
    label:"Morning", word:"UN\nLOCK", title:"Unlock", mins:14,
    intent:"Undo yesterday's sitting. Loosen the neck, mid-back and hips, then switch on the glutes and back muscles that a desk lets go weak.",
    cards:[
      {id:"chin", n:"Chin tucks and neck extension", area:"neck", type:"mob", dose:"10 reps, 3 s hold", reel:"DaIeUPjBSSO",

      ${D.tip?`<p class="tip">${D.tip}</p>`:""}
      <div class="areas">${hs.map(h=>`<span class="chip" style="--h:var(--${h})"><span class="d"></span>${AREAS[h]}</span>`).join("")}</div>
      <div class="ctas"><button class="cta" data-act="start">${n===0?"Start":n>=tot?"Review today's session":"Continue from move "+(n+1)} ${n>=tot?"":"<svg viewBox='0 0 24 24' width='20' height='20' fill='none' stroke='currentColor' stroke-width='2.4'><path d='M12 5v14M6 13l6 6 6-6'/></svg>"}</button></div>
      <div class="hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><span class="m">Swipe up</span><span class="k">Scroll, or press the down arrow</span></div>
    </div></section>`;
}

function cardHTML(c,i,tot,isDone){
  const src=c.reel&&REEL[c.reel];
  let ctrl="";
  if(c.timer){ctrl=`<button class="timer" data-act="timer" aria-label="Start timer, ${c.timer.s} seconds${c.timer.n>1?", "+c.timer.n+" rounds":""}"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="trk" cx="32" cy="32" r="27"/><circle class="arc" cx="32" cy="32" r="27"/></svg><span class="tt"><b>${fmt(c.timer.s)}</b><small>${c.timer.n>1?"x"+c.timer.n:"tap"}</small></span></button>`}
  else if(c.sets){ctrl=`<div class="sets" role="group" aria-label="Tap each set as you finish it">${Array.from({length:c.sets},(_,k)=>`<button class="set${isDone?" on":""}" data-act="set" data-k="${k}" aria-pressed="${isDone}"><span>${k+1}<small>SET</small></span></button>`).join("")}</div>`}
  return `<article class="card ex${isDone?" is-done":""}" data-id="${c.id}" data-i="${i}" style="--h:var(--${c.area})">
    ${bigHTML(BIG[c.area])}
    <div class="in"><div class="colA">
      <div class="kick"><span class="chip">${String(i+1).padStart(2,"0")} / ${String(tot).padStart(2,"0")}</span><span class="chip"><span class="d"></span>${AREAS[c.area]}</span><span class="chip">${TYPES[c.type]}</span>${(c.gear||[]).map(g=>`<span class="chip gear">${g}</span>`).join("")}<span class="chip donechip">${CHECK.replace('<svg','<svg width="12" height="12" stroke="currentColor" stroke-width="3" fill="none"')}Done</span></div>
      <h2 class="name">${c.n}</h2>
      <span class="dose">${c.dose}</span>
      <ol class="how">${c.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      </div><div class="colB">
      <dl class="cues"><div><dt>Feel</dt><dd>${c.feel}</dd></div><div><dt>Avoid</dt><dd>${c.avoid}</dd></div>${c.harder?`<div><dt>Harder</dt><dd>${c.harder}</dd></div>`:""}</dl>
      <div class="act">${ctrl}<button class="done" data-act="done" aria-pressed="${isDone}">${CHECK}<span>${isDone?"Done":"Mark done"}</span></button></div>
      <div class="tstat" aria-live="polite">${c.timer?"Tap the ring to start the timer":c.sets?"Tap each set as you finish it":""}</div>
      <div class="src">${src?`<a class="reel" href="${IG(c.reel)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Watch @${src.u}</a>`:`<span class="noreel">No exact reel in your saves. Follow the steps above.</span>`}${c.rel?`<a class="alt" href="${IG(c.rel)}" target="_blank" rel="noopener">Related: @${REEL[c.rel].u}</a>`:""}${(c.alt||[]).map(a=>`<a class="alt" href="${IG(a)}" target="_blank" rel="noopener">Swap: @${REEL[a].u}</a>`).join("")}</div>
    </div></div>
    <div class="pop" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="var(--h)"/><path d="M36 62l16 16 32-34" fill="none" stroke="var(--on-hue)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </article>`;
}

function endHTML(deck){
  const w={am:"GOOD\nSTART",pm:"DONE\nTODAY",gear:"STRONG"}[deck];
  return `<section class="card end" style="--h:var(--feet)">${bigHTML(w)}<div class="in" id="end-in"></div></section>`;
}
function weekGear(){let n=0; const d=new Date(); for(let i=0;i<7;i++){if(complete(dk(d),"gear"))n++; d.setDate(d.getDate()-1)} return n}
function paintEnd(){
  const el=document.getElementById("end-in"); if(!el)return;
  const D=DECKS[cur], n=doneCount(today,cur), tot=D.cards.length, all=n>=tot;
  const others=Object.keys(DECKS).filter(k=>k!==cur);
  const head={am:"Morning done",pm:"Evening done",gear:"Ball + Band done"}[cur];
  const msg={am:"Glutes and back are switched on. The evening session builds strength and lets it all go.",pm:"That's both halves of the day if you did the morning too. Same again tomorrow.",gear:"Extra strength banked. Aim for 3 of these a week."}[cur];
  const bw=all?{am:"GOOD\nSTART",pm:"DONE\nTODAY",gear:"STRONG"}[cur]:"KEEP\nGOING", big=el.parentNode.querySelector(".big");
  if(big){const ls=bw.split("\n"); big.textContent=bw; big.style.setProperty("--n",ls.length); big.style.setProperty("--w",Math.max(...ls.map(l=>l.length)))}
  el.innerHTML=`${all?`<div class="bigcheck">${CHECK}</div>`:""}
    <span class="eyebrow">${D.label} session</span>
    <h2 class="h1">${all?head:n+" of "+tot+" done"}</h2>
    <p class="lede">${all?msg:"Scroll back up to anything you skipped, or finish the rest later."}</p>
    <div class="stats four"><div class="stat"><b>${streak()}</b><span>day streak (AM + PM)</span></div><div class="stat"><b>${weekGear()}/3</b><span>ball + band this week</span></div><div class="stat"><b>${doneCount(today,"am")}/${DECKS.am.cards.length}</b><span>morning today</span></div><div class="stat"><b>${doneCount(today,"pm")}/${DECKS.pm.cards.length}</b><span>evening today</span></div></div>
    <div class="ctas">${others.map((k,i)=>`<button class="cta${i?" ghost":""}" data-act="deck" data-deck="${k}">Open ${DECKS[k].label}</button>`).join("")}<button class="cta ghost" data-act="log">See your log</button></div>
    <p class="note">Strength work should feel like effort, never sharp pain. If heel pain is worst on your first steps for weeks, or a shin hurts in one sharp spot, get a physio to look at it.</p>`;
}

function render(deck, jump){
  stopTimer(); cur=deck;
  try{history.replaceState(null,"","#"+deck)}catch(e){}
  const D=DECKS[deck], r=day(today);
  feed.innerHTML=introHTML(deck)+D.cards.map((c,i)=>cardHTML(c,i,D.cards.length,r[deck].includes(c.id))).join("")+endHTML(deck);
  paintEnd();
  rail.innerHTML=D.cards.map((c,i)=>`<button data-i="${i}" aria-label="Go to ${c.n}"></button>`).join("");
  list.innerHTML=D.cards.map((c,i)=>`<button data-i="${i}" style="--h:var(--${c.area})"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="nm">${c.n}</span><span class="ck2" aria-hidden="true">✓</span></button>`).join("");
  document.querySelectorAll("#seg button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.deck===deck); const k=b.dataset.deck; b.innerHTML=DECKS[k].label+(complete(today,k)?`<span class="ck">✓</span>`:"")});
  $("#pmins").textContent="~"+D.mins+" min";
  paintProgress();
  feed.scrollTop=0;
  const n=doneCount(today,deck);
  if(jump&&n>0&&n<D.cards.length) goFirstUndone(false);
  onScroll();
}
function paintProgress(){
  const D=DECKS[cur], n=doneCount(today,cur), tot=D.cards.length;
  $("#pcount").textContent=n+"/"+tot;
  $("#pbar").style.width=(n/tot*100)+"%";
  const r=day(today)[cur];
  rail.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("done",r.includes(D.cards[i].id)));
  list.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("done",r.includes(D.cards[i].id)));
  document.querySelectorAll("#seg button").forEach(b=>{const k=b.dataset.deck; b.innerHTML=DECKS[k].label+(complete(today,k)?`<span class="ck">✓</span>`:"")});
}
function cards(){return [...feed.querySelectorAll(".card")]}
function scrollToCard(el,smooth=true){if(el) feed.scrollTo({top:el.offsetTop,behavior:smooth&&!reduce?"smooth":"auto"})}
function goFirstUndone(smooth=true){const r=day(today)[cur]; const ex=[...feed.querySelectorAll(".card.ex")]; const t=ex.find(e=>!r.includes(e.dataset.id))||feed.querySelector(".card.end"); scrollToCard(t,smooth)}

let ticking=false;
function onScroll(){
  if(ticking)return; ticking=true;
  requestAnimationFrame(()=>{ticking=false;
    const y=feed.scrollTop+feed.clientHeight*.4; let active=null;
    cards().forEach(c=>{if(c.offsetTop<=y)active=c});
    cards().forEach(c=>c.classList.toggle("is-active",c===active));
    const i=active&&active.classList.contains("ex")?+active.dataset.i:-1;
    rail.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("cur",k===i));
    rail.style.opacity=i<0?".35":"1";
    list.querySelectorAll("button").forEach((b,k)=>{b.classList.toggle("cur",k===i); if(k===i&&list.offsetParent)b.scrollIntoView({block:"nearest"})});
  });
}
feed.addEventListener("scroll",onScroll,{passive:true});

function setDone(id,on,opt={}){
  const r=day(today)[cur], el=feed.querySelector(`.card.ex[data-id="${id}"]`);
  if(on&&!r.includes(id))r.push(id);
  if(!on){const k=r.indexOf(id); if(k>-1)r.splice(k,1)}
  save();
  if(el){
    el.classList.toggle("is-done",on);
    const b=el.querySelector(".done"); b.setAttribute("aria-pressed",on); b.querySelector("span").textContent=on?"Done":"Mark done";
    el.querySelectorAll(".set").forEach(s=>{s.classList.toggle("on",on); s.setAttribute("aria-pressed",on)});
    if(on&&opt.pop){const p=el.querySelector(".pop"); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go")}
  }
  paintProgress(); paintEnd();
  if(on){buzz(35); beep(1046,.12);
    if(opt.advance!==false&&el){setTimeout(()=>{if(el.classList.contains("is-done"))scrollToCard(el.nextElementSibling)},reduce?150:720)}}
}

/* timer */
let T=null;
function stopTimer(msg){if(!T)return; clearInterval(T.iv); const el=T.card; el.classList.remove("ticking"); const ts=el.querySelector(".tstat"); if(ts)ts.textContent=msg||"Tap the ring to start the timer"; const a=el.querySelector(".arc"); if(a)a.style.strokeDashoffset=0; const b=el.querySelector(".timer b"); if(b)b.textContent=fmt(T.c.timer.s); const sm=el.querySelector(".timer small"); if(sm)sm.textContent=T.c.timer.n>1?"x"+T.c.timer.n:"tap"; T=null}
function labelFor(c,r){const t=c.timer; if(t.labels)return t.labels[r]; if(t.n===2)return r===0?"First side":"Second side"; return "Hold"}
function paintTimer(){
  const el=T.card, t=T.c.timer, total=T.phase==="hold"?t.s:5;
  el.querySelector(".arc").style.strokeDashoffset=C*(1-T.left/total);
  el.querySelector(".timer b").textContent=fmt(T.left);
  el.querySelector(".timer small").textContent=T.phase==="switch"?"switch":(T.round+1)+"/"+t.n;
  el.querySelector(".tstat").textContent=T.phase==="switch"?"Switch: "+labelFor(T.c,T.round)+" next":(T.iv?labelFor(T.c,T.round)+(t.n>1?" · "+(T.round+1)+" of "+t.n:""):"Paused. Tap the ring to resume");
}
function tick(){
  T.left--;
  if(T.left<=0){
    if(T.phase==="hold"){
      T.round++;
      if(T.round>=T.c.timer.n){beep(784,.12); setTimeout(()=>beep(1046,.25),140); buzz([90,60,90]); const id=T.c.id; stopTimer("Timer finished. Nice work."); setDone(id,true,{pop:true}); return}
      T.phase="switch"; T.left=5; beep(880,.15); buzz(150);
    } else {T.phase="hold"; T.left=T.c.timer.s; beep(660,.1)}
  } else if(T.phase==="hold"&&T.left<=3){beep(520,.05)}
  paintTimer();
}
function toggleTimer(el){
  const c=DECKS[cur].cards[+el.dataset.i];
  if(T&&T.card===el){
    if(T.iv){clearInterval(T.iv); T.iv=null; el.classList.remove("ticking")} else {T.iv=setInterval(tick,1000); el.classList.add("ticking")}
    paintTimer(); return;
  }
  stopTimer(); keepAwake(); beep(660,.1);
  T={card:el,c,round:0,left:c.timer.s,phase:"hold",iv:setInterval(tick,1000)};
  el.classList.add("ticking"); paintTimer();
}

/* taps */
feed.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const el=b.closest(".card"), act=b.dataset.act;
  if(act==="start"){keepAwake(); if(complete(today,cur))scrollToCard(feed.querySelector(".card.ex")); else goFirstUndone(); return}
  if(act==="deck"){render(b.dataset.deck,true); return}
  if(act==="log"){openSheet("log"); return}
  if(act==="done"){const id=el.dataset.id; setDone(id,!el.classList.contains("is-done"),{pop:!el.classList.contains("is-done")}); return}
  if(act==="timer"){toggleTimer(el); return}
  if(act==="set"){
    b.classList.toggle("on"); b.setAttribute("aria-pressed",b.classList.contains("on")); buzz(20); beep(700+ +b.dataset.k*120,.07);
    const all=[...el.querySelectorAll(".set")].every(s=>s.classList.contains("on"));
    const st=el.querySelector(".tstat"); const n=el.querySelectorAll(".set.on").length, tot=el.querySelectorAll(".set").length;
    if(all&&!el.classList.contains("is-done")){setDone(el.dataset.id,true,{pop:true})}
    else st.textContent=n?`${n} of ${tot} sets. Rest 30 to 45 s.`:"Tap each set as you finish it";
  }
});
/* double tap to mark done, like a reel */
let lastTap={t:0,x:0,y:0,el:null}, down=null;
feed.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY}});
feed.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>12)return;
  if(e.target.closest("button,a"))return;
  const el=e.target.closest(".card.ex"); if(!el)return;
  const now=Date.now();
  if(lastTap.el===el&&now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){
    const p=el.querySelector(".pop"); p.style.left="";
    if(!el.classList.contains("is-done")) setDone(el.dataset.id,true,{pop:true}); else {p.classList.remove("go"); void p.offsetWidth; p.classList.add("go")}
    lastTap={t:0}; return;
  }
  lastTap={t:now,x:e.clientX,y:e.clientY,el};
});
rail.addEventListener("click",e=>{const b=e.target.closest("button"); if(b)scrollToCard(feed.querySelector(`.card.ex[data-i="${b.dataset.i}"]`))});
list.addEventListener("click",e=>{const b=e.target.closest("button"); if(b)scrollToCard(feed.querySelector(`.card.ex[data-i="${b.dataset.i}"]`))});
document.getElementById("seg").addEventListener("click",e=>{const b=e.target.closest("button"); if(b&&b.dataset.deck!==cur)render(b.dataset.deck,true)});

/* keyboard: arrows move between cards on desktop */
function activeCard(){return feed.querySelector(".card.is-active")}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const open=document.querySelector(".sheet.open");
  if(!open&&(e.key==="d"||e.key==="D")){const el=activeCard(); if(el&&el.classList.contains("ex")){setDone(el.dataset.id,!el.classList.contains("is-done"),{pop:!el.classList.contains("is-done")})} return}
  if(!open&&(e.key==="t"||e.key==="T")){const el=activeCard(); if(el&&el.querySelector(".timer"))toggleTimer(el); return}
  if(!open&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
    const cs=cards(), y=feed.scrollTop+5; let i=cs.findIndex(c=>c.offsetTop+c.offsetHeight>y);
    i=Math.max(0,Math.min(cs.length-1,i+(e.key==="ArrowDown"?1:-1))); scrollToCard(cs[i]); e.preventDefault();
  }
  if(e.key==="Escape")closeSheets();
});

/* sheets */
function libHTML(){
  return `<div class="ph"><h2>Your reels</h2><button class="x" data-close aria-label="Close">×</button></div>
  <p>Picked from your "Stretching Excercises" collection and all 3,192 of your saves. Tagged where each one is used. None of your saves cover yoga ball or band work, so that section runs on written steps.</p>
  ${LIB.map(([h,name,arr])=>`<div class="grp" style="--h:var(--${h})"><h3><span class="d"></span>${name}<span>${arr.length}</span></h3><ul class="lib">${arr.map(([c,u,t])=>`<li><div style="min-width:0"><a href="${IG(c)}" target="_blank" rel="noopener">${t}</a><div class="by">@${u}</div></div>${USED[c]?`<span class="use">${USED[c]}</span>`:""}</li>`).join("")}</ul></div>`).join("")}`;
}
function logHTML(){
  const d=new Date(); d.setDate(d.getDate()-27); let full=0, part=0, cells="";
  let gearN=0;
  for(let i=0;i<28;i++){const k=dk(d), a=complete(k,"am"), p=complete(k,"pm"), g=complete(k,"gear"); if(g)gearN++; if(a&&p)full++; else if(a||p||doneCount(k,"am")||doneCount(k,"pm"))part++;
    cells+=`<div class="day${k===today?" today":""}">${d.getDate()}<i class="am${a?" on":""}"></i><i class="pm${p?" on":""}"></i><i class="gear${g?" on":""}"></i></div>`; d.setDate(d.getDate()+1)}
  return `<div class="ph"><h2>Last 4 weeks</h2><button class="x" data-close aria-label="Close">×</button></div>
  <p>A bar fills when every move in that session is done. Saved on this device only.</p>
  <div class="stats" style="margin-bottom:14px"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>${full}</b><span>full days</span></div><div class="stat"><b>${gearN}</b><span>ball + band</span></div></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><b style="background:var(--legs)"></b>Morning</span><span><b style="background:var(--hips)"></b>Evening</span><span><b style="background:var(--neck)"></b>Ball + Band</span></div>
  <button class="small" id="clear-today">Clear today's ticks</button>`;
}
function openSheet(which){
  closeSheets(true);
  const s=document.getElementById("sheet-"+which);
  document.getElementById(which+"-body").innerHTML=which==="lib"?libHTML():logHTML();
  s.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add("open")));
  const x=s.querySelector("[data-close]"); x&&x.focus();
  const ct=document.getElementById("clear-today"); if(ct)ct.onclick=()=>{store.days[today]={am:[],pm:[],gear:[]}; save(); closeSheets(); render(cur,false)};
}
function closeSheets(instant){document.querySelectorAll(".sheet").forEach(s=>{if(s.hidden)return; s.classList.remove("open"); if(instant||reduce)s.hidden=true; else setTimeout(()=>{if(!s.classList.contains("open"))s.hidden=true},260)})}
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-close]"))closeSheets()}));
$("#open-lib").onclick=()=>openSheet("lib");
$("#open-log").onclick=()=>openSheet("log");

/* start: hash, then last used, then time of day */
let start=(location.hash||"").slice(1);
if(!DECKS[start]){const h=new Date().getHours(); start=(h<15&&!complete(today,"am"))?"am":"pm"}
render(start,true);
/* app: offline support, home-screen shortcuts */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
window.addEventListener("hashchange",()=>{const k=(location.hash||"").slice(1); if(DECKS[k]&&k!==cur)render(k,true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&dk(new Date())!==today)location.reload()});
</script>
</body>
</html>
